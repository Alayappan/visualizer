[project]
name = "graph-visualizer-desktop"
version = "1.0.0"
description = "Neo4j Graph Visualizer Desktop Application built with Python and Tkinter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
